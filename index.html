<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>US Public Schools</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.8.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.8.1/mapbox-gl.js"></script>

    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        /* layout of the legend panel */
        #legend {
            position: absolute;
            bottom: 40;
            right: auto;
            left: 20;
            width: 140px;
            background: #e5e5e5;
            margin-right: 120px;
            margin-left: 20px;
            margin-top: 350px;
            padding: 10px 20px 10px 10px;
            border-radius: 3px;
            text-align: left;
            z-index: 2;
        }

        .box{
            display:inline-block;
            width:15px;
            height:15px;
            margin-right:6px;
}

        /* each line for a break */
        .break {
            position: relative;
            margin: 0px;
            padding: 0px;
        }

        a {
            color: rgb(0, 57, 15)
        }

        /* Map title */
        #title {
            position: absolute;
            top: 0;
            left: 0;
            margin-top: 20px;
            margin-left: 20px;
            font-size: 25pt;
            color: white;
        }

        #subtitle {
            position: absolute;
            top: 0;
            left: 0;
            margin-top: 70px;
            margin-left: 90px;
            font-size: 15pt;
            color: white;
        }

        /* info panel */
        #info-panel{
        position:absolute;
        top:0;
        right:0;
        width:320px;
        height:100%;
        background: rgba(255,255,255,0.92);
        padding: 14px;
        overflow-y:auto;
        box-shadow: -2px 0 8px rgba(0,0,0,0.2);
        z-index: 3;
        }

        .panel-header{
        margin-bottom:10px;
        }
        .panel-title{
        font-weight:700;
        font-size:14pt;
        }
        .panel-subtitle{
        font-size:10pt;
        color:#333;
        }

        /* icons */
        #controls{
        position:absolute;
        top:20px;
        right:340px; /* keep it just left of panel */
        display:flex;
        gap:8px;
        }

        #controls button{
        width:38px;
        height:38px;
        border:none;
        border-radius:6px;
        cursor:pointer;
        background:#e5e5e5;
        }

        #controls button:hover{
        background:#ccc;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="legend"></div>
    <div id="title">US Public Schools</div>
    <div id="subtitle">2021-2022</div>

    <!-- info panel -->
    <div id="info-panel">
        <div class="panel-header">
            <div class="panel-title">Dashboard</div>
            <div class="panel-subtitle">Hover over each state for more information! Use reset button to zoom back to home view.</div>
        </div>

        <div id="info-content">
            <p><strong>State:</strong> —</p>
            <p><strong>Public Schools:</strong> —</p>
            <p><strong>% of US Total:</strong> —</p>
        </div>

        <hr>

        <div class="panel-title">Top 10 States (by school count)</div>
        <canvas id="chart" width="300" height="220"></canvas>
    </div>

    <!--panel icons-->
    <div id="controls">
        <button id="btn-reset" title="Reset">⟲</button>
    </div>

    <script>
        // Mapbox token
        mapboxgl.accessToken = 'pk.eyJ1IjoibWFpa2hhbmh0IiwiYSI6ImNtbHlqcThoNzB4YTUzZnE3aWd4ZXMzbDQifQ.sDgXTKBErHB9WNp5C711bw';

        // initialize map
        let map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v10',
            zoom: 3,
            minZoom: 3,
            center: [-98, 38], // US center
            projection: 'albers'
        });

        // breaks, colors, radius , ADJ LATER!!
        const breaks = [500, 1000, 2000, 3000, 4000, 6000];
        const colors = ['#edf8fb','#ccece6','#99d8c9','#66c2a4','#2ca25f','#006d2c','#00441b'];

        // BUTTON: reset 
        const resetBtn = document.getElementById('btn-reset');

        // starting: store initial "home" view to reset to
        const homeView = {
        center: [-98, 38],
        zoom: 3,
        bearing: 0,
        pitch: 0
        };

        resetBtn.addEventListener('click', () => {
        map.easeTo({// map camera reset
            center: homeView.center,
            zoom: homeView.zoom,
            bearing: homeView.bearing,
            pitch: homeView.pitch
        });

        // reset info panel text
        document.getElementById('info-content').innerHTML = `
            <p><strong>State:</strong> —</p>
            <p><strong>Public Schools:</strong> —</p>
            <p><strong>% of US Total:</strong> —</p>
        `;

        // reset cursor
        map.getCanvas().style.cursor = '';
        });

        map.on('load', () => {
            const legend = document.getElementById('legend');

            // source: data to map (choropleth)
            map.addSource('schoolCounts', {
                type: 'geojson',
                data: 'assets/public_school_count.geojson' // MY geojson file
            });

            // choropleth fill layer
            map.addLayer({
                id: 'schools-choropleth',
                type: 'fill',
                source: 'schoolCounts',
                paint: {
                'fill-color': [
                    'step',
                    ['get', 'NUMPOINTS'], // property/value name on qgis/geojson
                    colors[0], breaks[0],
                    colors[1], breaks[1],
                    colors[2], breaks[2],
                    colors[3], breaks[3],
                    colors[4], breaks[4],
                    colors[5], breaks[5],
                    colors[6]
                ],
                'fill-outline-color': '#000000',
                'fill-opacity': 0.50
                }
            });

            // legend for choropleth style
            let labels = ['<strong>Schools per State</strong>'];
            for (let i = 0; i < colors.length; i++) {
                const from = (i === 0) ? 0 : breaks[i - 1];
                const to = (i < breaks.length) ? breaks[i] : '+';
                labels.push(
                `<p class="break"><span class="box" style="background:${colors[i]}"></span>
                    ${from.toLocaleString()} – ${to === '+' ? '+' : to.toLocaleString()}</p>`
                );
            }
            legend.innerHTML = labels.join('') +
                '<p style="text-align:right;font-size:10pt">Source: <a href="https://catalog.data.gov/dataset/public-school-locations-2021-22-5a116">Data.gov</a></p>';

            // DYNAMIC FEATURE: hover interaction - updating info panel
            map.on('mousemove', (e) => {
                const features = map.queryRenderedFeatures(e.point, {
                    layers: ['schools-choropleth']
                });

                if (!features.length) {
                    // reset when not hovering a state
                    document.getElementById('info-content').innerHTML = `
                    <p><strong>State:</strong> —</p>
                    <p><strong>Public Schools:</strong> —</p>
                    <p><strong>% of US Total:</strong> —</p>
                    `;
                    map.getCanvas().style.cursor = '';
                    return;
                }

                map.getCanvas().style.cursor = 'pointer';

                const p = features[0].properties;

                // IMPORTANT: your GeoJSON uses NUMPOINTS
                const count = Number(p.NUMPOINTS || 0);
                const pct = ((count / 102130) * 100).toFixed(1);

                document.getElementById('info-content').innerHTML = `
                    <p><strong>State:</strong> ${p.NAME}</p>
                    <p><strong>Public Schools:</strong> ${count.toLocaleString()}</p>
                    <p><strong>% of US Total:</strong> ${pct}%</p>
                `;
            });

            // Top 10 chart
            fetch('assets/public_School_count.geojson')
            .then(r => r.json())
            .then(data => {
                // make array: {name, count}
                const rows = data.features.map(f => ({
                name: f.properties.STUSPS || f.properties.NAME,   // use abbreviation if you want
                fullName: f.properties.NAME,
                count: Number(f.properties.NUMPOINTS || 0)
                }));

                // sort: descending for top 10
                rows.sort((a, b) => b.count - a.count);
                const top10 = rows.slice(0, 10);

                drawTop10Chart(top10);
            });

            // bar chart rendering function
            function drawTop10Chart(top10) {
            const canvas = document.getElementById('chart');
            const ctx = canvas.getContext('2d');

            // clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // chart box settings
            const paddingLeft = 45;
            const paddingRight = 10;
            const paddingTop = 10;
            const paddingBottom = 20;

            const w = canvas.width - paddingLeft - paddingRight;
            const h = canvas.height - paddingTop - paddingBottom;

            const maxVal = Math.max(...top10.map(d => d.count));

            // create bars & labels
            const barH = h / top10.length;

            ctx.font = '12px Open Sans';
            ctx.fillStyle = '#111';

            for (let i = 0; i < top10.length; i++) {
                const d = top10[i];

                const y = paddingTop + i * barH;
                const barW = (d.count / maxVal) * w;

                // bar
                ctx.fillStyle = '#2ca25f'; //bar color
                ctx.fillRect(paddingLeft, y + 3, barW, barH - 6);

                // state label -left side
                ctx.fillStyle = '#111';
                ctx.fillText(d.name, 5, y + barH * 0.70);

                // value label -right side
                ctx.fillText(d.count.toLocaleString(), paddingLeft + barW + 6, y + barH * 0.70);
            }

            // axis line
            ctx.strokeStyle = '#999';
            ctx.beginPath();
            ctx.moveTo(paddingLeft, paddingTop);
            ctx.lineTo(paddingLeft, paddingTop + h);
            ctx.stroke();
            }
        });
    </script>
</body>

</html>
